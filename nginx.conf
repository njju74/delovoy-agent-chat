server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Личный ИИ-ассистент";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    location = /api/upload {
        proxy_pass https://n8n.agent3d.ru/webhook/agent-knowledge-upload-v1;

        proxy_ssl_server_name on;
        proxy_set_header Host n8n.agent3d.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/documents {
        proxy_pass https://n8n.agent3d.ru/webhook/agent-knowledge-documents-v1;

        proxy_ssl_server_name on;
        proxy_set_header Host n8n.agent3d.ru;
        proxy_set_header X-Real-IP $remote_addr;
