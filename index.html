<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Деловой агент — личный ассистент</title>

  <link
    href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #0f1620;
      --card: #172233;
      --text: #edf3f9;
      --muted: #9aabbd;
      --accent: #61d4b3;
      --line: #2d4057;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--line);
    }

    .header-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .sub {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .model-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .model-panel label {
      color: var(--muted);
      font-size: 13px;
    }

    .model-panel select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      min-width: 180px;
    }

    .model-status {
      width: 100%;
      margin: 0;
      text-align: right;
      color: var(--muted);
      font-size: 12px;
    }

    .model-status.error {
      color: var(--danger);
    }

    .memory-link {
      display: inline-block;
      margin-top: 14px;
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
    }

    .memory-link:hover {
      text-decoration: underline;
    }

    main {
      max-width: 1100px;
      height: calc(100vh - 150px);
      min-height: 520px;
      margin: 0 auto;
      padding: 0 24px 24px;
    }

    #n8n-chat {
      height: 100%;
    }

    @media (max-width: 650px) {
      .model-panel {
        justify-content: flex-start;
      }

      .model-status {
        text-align: left;
      }

      main {
        height: calc(100vh - 185px);
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-row">
      <div>
        <h1>Деловой агент — личный ассистент</h1>

        <p class="sub">
          Рабочий чат с памятью проектов, PostgreSQL и pgvector.
        </p>
      </div>

      <div class="model-panel">
        <label for="model-select">Модель:</label>

        <select id="model-select">
          <option value="yandex|yandexgpt-lite">
            YandexGPT Lite
          </option>

          <option value="plusvibe|gpt-5.6-luna">
            PlusVibe / gpt-5.6-luna
          </option>
        </select>

        <p id="model-status" class="model-status">
          Загружаем текущую модель...
        </p>
      </div>
    </div>

    <a class="memory-link" href="memory.html">
      📚 Память и документы
    </a>
  </header>

  <main>
    <div id="n8n-chat"></div>
  </main>

  <script src="/config.js"></script>

  <script type="module">
    import {
      createChat
    } from "https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js";

    createChat({
      webhookUrl: window.CHAT_CONFIG.webhookUrl,
      mode: "fullscreen",
      target: "#n8n-chat",
      showWelcomeScreen: true,
      initialMessages: [
        "Здравствуйте. Я ваш личный рабочий ассистент Делового агента."
      ],
      i18n: {
       en: {
        /* title: "Деловой агент",
          subtitle: "Личный рабочий ассистент", */
          inputPlaceholder: "Напишите задачу или вопрос...",
          getStarted: "Начать диалог"
        } 
      }
    });

    const modelSelect = document.getElementById("model-select");
    const modelStatus = document.getElementById("model-status");

    const models = {
      "yandex|yandexgpt-lite": "YandexGPT Lite",
      "plusvibe|gpt-5.6-luna": "PlusVibe / gpt-5.6-luna"
    };

    function setModelStatus(text, isError = false) {
      modelStatus.textContent = text;
      modelStatus.classList.toggle("error", isError);
    }

    async function loadCurrentModel() {
      try {
        const response = await fetch("/api/model/current");
        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(
            result.message || "Не удалось получить текущую модель."
          );
        }

        const value = `${result.provider}|${result.model}`;

        if (models[value]) {
          modelSelect.value = value;
        }

        setModelStatus(
          `Сейчас отвечает: ${models[value] || result.model}`
        );
      } catch (error) {
        setModelStatus(
          `Ошибка загрузки модели: ${error.message}`,
          true
        );
      }
    }

    modelSelect.addEventListener("change", async () => {
      const [provider, model] = modelSelect.value.split("|");

      modelSelect.disabled = true;
      setModelStatus("Переключаем модель...");

      try {
        const response = await fetch("/api/model/select", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            provider,
            model
          })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(
            result.message || "Не удалось переключить модель."
          );
        }

        const value = `${result.provider}|${result.model}`;

        setModelStatus(
          `✅ Следующий ответ: ${models[value] || result.model}`
        );
      } catch (error) {
        setModelStatus(
          `Ошибка переключения: ${error.message}`,
          true
        );

        await loadCurrentModel();
      } finally {
        modelSelect.disabled = false;
      }
    });

    loadCurrentModel();
  </script>
</body>
</html>
