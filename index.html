<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Деловой агент — личный ассистент</title> 

  <style>
    :root {
      --bg: #0f1620; 
      --card: #172233;
      --card-2: #1d2c40;
      --text: #edf3f9;
      --muted: #9aabbd;
      --accent: #61d4b3;
      --line: #2d4057;
      --danger: #f87171;
      --user: #1d5a55;
      --assistant: #1b2a3d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }
.chat-shell.sidebar-hidden .sidebar {
      width: 0;
      flex-basis: 0;
      overflow: hidden;
      border-right: 0;
    }

    .chat-shell.sidebar-hidden .sidebar-head,
    .chat-shell.sidebar-hidden .conversation-list {
      display: none;
    }

    .message-content {
  white-space: pre-wrap;
  line-height: 1.5;
}

.code-block {
  margin: 12px 0;
  overflow: hidden;
  border: 1px solid #01050d;
  border-radius: 8px;
  background: #0cf24d;
}

.code-block-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  background: #0cf24d;
  border-bottom: 1px solid #d9dee8;
}

.code-language {
  color: #667085;
  font: 12px monospace;
}

.copy-code-button {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  padding: 4px 8px;
  border: 1px solid #c8ced8;
  border-radius: 6px;
  background: #0cf24d;
  color: #344054;
  cursor: pointer;
  font-size: 12px;
}

.copy-code-button:hover {
  background: #0cf24d;
}

.code-block pre {
  margin: 0;
  padding: 12px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
}

.code-block code {
  font-family: Consolas, Monaco, monospace;
  font-size: 13px;
  line-height: 1.5;
}
    .conversation-row {
      display: flex;
      gap: 5px;
      font-weight: 400;
      align-items: stretch;
    }

    .conversation-open {
      flex: 1;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px;
      background: transparent;
      color: var(--text);
      text-align: left;
      font-weight: 400;
      cursor: pointer;
    }

    .conversation-open:hover {
      border-color: var(--line);
      background: var(--card);
    }

    .conversation-row.active .conversation-open {
      border-color: var(--accent);
      background: #047a57;
    }

    .conversation-delete {
      align-self: center;
      border: 1px solid #8f3f49;
      border-radius: 7px;
      padding: 6px 8px;
      background: transparent;
      color: #ff9aa6;
      cursor: pointer;
    }

.sidebar {
      width: 400px;
      flex: 0 0 400px;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: var(--card-2);
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-head h2 {
      margin: 0;
      font-size: 15px;
    }

    .sidebar-head button {
      padding: 5px 9px;
    }

    .conversation-list {
      display: grid;
      gap: 5px;
      padding: 8px;
    }

    .conversation-item {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px;
      background: transparent;
      color: var(--text);
      text-align: left;
      font-weight: 400;
    }

    .conversation-item:hover {
      border-color: var(--line);
      background: var(--card);
    }

    .conversation-item.active {
      border-color: var(--accent);
      background: #0cf24d;
    }

    .conversation-title {
      display: block;
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversation-preview {
      display: -webkit-box;
      overflow: hidden;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .conversation-meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 10px;
    }

    @media (max-width: 780px) {
      .chat-shell {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        flex-basis: auto;
        max-height: 200px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .conversation-list {
        display: flex;
        overflow-x: auto;
      }

      .conversation-item {
        min-width: 220px;
      }
    }

    .app {
      max-width: 1100px;
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 18px 24px 22px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 16px;
    }

    .sub {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 10px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
       font-size: 10px;
      gap: 8px;
    }

    .controls label {
      color: var(--muted);
      font-size: 10px;
    }

    select,
    button,
    textarea {
      font: inherit;
    }

    select {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: var(--card);
      color: var(--text);
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      background: var(--accent);
      color: #0f1620;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .button-secondary {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
    }

    .model-status {
      width: 100%;
      margin: 0;
      text-align: right;
      color: var(--muted);
      font-size: 10px;
    }

    .model-status.error,
    .chat-status.error {
      color: var(--danger);
    }

    .memory-link {
      display: inline-block;
      margin-top: 13px;
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
    }

    .memory-link:hover {
      text-decoration: underline;
    }

    .chat-shell {
      display: flex;
      flex: 1;
      min-height: 0;
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: var(--card);
    }

 .messages {
      flex: 1;
      overflow-y: auto;
      padding: 13px;
    }

    .empty-state {
      margin: 55px auto;
      max-width: 620px;
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
    }

    .message {
      max-width: 82%;
      margin: 0 0 14px;
      padding: 9px 11px;
      font-size: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.42;
      overflow-wrap: anywhere;
    }

    .message.user {
      margin-left: auto;
      background: var(--user);
      border-bottom-right-radius: 3px;
    }

    .message.assistant {
      margin-right: auto;
      background: var(--assistant);
      border-bottom-left-radius: 3px;
    }

    .message-role {
      margin-bottom: 4px;
      color: var(--accent);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .message-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 9px;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 14px;
      background: var(--card-2);
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 76px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 11px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      font-size: 13px;
      line-height: 1.4;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .composer-bottom {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    .chat-status {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 680px) {
      .app {
        padding: 16px;
      }

      .controls {
        justify-content: flex-start;
      }

      .model-status {
        text-align: left;
      }

      .message {
        max-width: 94%;
      }
    }
  </style>
</head>

  <script>
    const STORAGE_KEY = "delovoy_agent_conversation_id";

    const messagesElement = document.getElementById("messages");
    const messageInput = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const newChatButton = document.getElementById("new-chat-button");

    const modelSelect = document.getElementById("model-select");
    const modelStatus = document.getElementById("model-status");
    const chatStatus = document.getElementById("chat-status");

    const chatShell =
      document.querySelector(".chat-shell");

    const toggleSidebarButton =
      document.getElementById("toggle-sidebar");

    const SIDEBAR_STORAGE_KEY =
      "delovoy_agent_sidebar_hidden";

    
    const scrollUpButton =
      document.getElementById("scroll-up-button");

    const scrollDownButton =
      document.getElementById("scroll-down-button");

    const conversationList =
      document.getElementById("conversation-list");

    const refreshConversationsButton =
      document.getElementById("refresh-conversations");

    let models = {};
    let conversationId = null;

    function setStatus(element, text, isError = false) {

        `;

        setStatus(

    }

      element.textContent = text;

function modelKey(provider, model) {

    async function loadModels() {

        const availableModels = result.models || [];

        models = {};

          modelSelect.appendChild(option);

          throw new Error(

          );
        }

        modelSelect.disabled = false;
      } catch (error) {
        modelSelect.innerHTML = `
          <option value="">
            Ошибка загрузки моделей
          </option>
        `;

        setStatus(
          modelStatus,
          `Ошибка загрузки моделей: ${error.message}`,
          true
        );
      }
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, options);

      let result = {};

      try {
        result = await response.json();
      } catch {
        throw new Error("Сервер вернул некорректный JSON.");
      }

      if (!response.ok || !result.ok) {
        throw new Error(
          result.message || "Сервер вернул ошибку."
        );
      }

      return result;
    }

    function formatDate(value) {
      if (!value) return "";

      return new Date(value).toLocaleString("ru-RU");
    }

    function scrollToBottom() {
      messagesElement.scrollTop = messagesElement.scrollHeight;
    }

  function renderMessage(message) {
  const role = message.role === "user"
    ? "user"
    : "assistant";

  const wrapper = document.createElement("div");
  wrapper.className = `message ${role}`;

  const roleLabel = document.createElement("div");
  roleLabel.className = "message-role";
  roleLabel.textContent = role === "user"
    ? "Вы"
    : "Деловой агент";

  const content = document.createElement("div");
  content.className = "message-content";

  const messageText = message.content || "";

  if (role === "assistant") {
    // Для ответа ассистента обрабатываем блоки ```...```
    content.appendChild(
      renderMessageContent(messageText)
    );
  } else {
    // Вопрос пользователя показываем обычным текстом
    content.textContent = messageText;
  }

  wrapper.append(roleLabel, content);

  if (message.created_at || message.metadata?.model) {
    const meta = document.createElement("div");
    meta.className = "message-meta";

    const parts = [];

    if (message.created_at) {
      parts.push(formatDate(message.created_at));
    }

    if (message.metadata?.model) {
      parts.push(
        `${message.metadata.provider || "model"} / ` +
        `${message.metadata.model}`
      );
    }

    meta.textContent = parts.join(" · ");
    wrapper.appendChild(meta);
  }

  messagesElement.appendChild(wrapper);
}
function renderMessageContent(content) {
  const fragment = document.createDocumentFragment();

  const codeBlockRegex =
    /```([a-zA-Z0-9_+-]*)[ \t]*\n?([\s\S]*?)```/g;

  let lastIndex = 0;
  let match;

  while ((match = codeBlockRegex.exec(content)) !== null) {
    // Обычный текст перед блоком кода
    const textBefore = content.slice(lastIndex, match.index);

    if (textBefore) {
      const textElement = document.createElement("div");
      textElement.className = "message-content";
      textElement.textContent = textBefore;
      fragment.appendChild(textElement);
    }

    const language = match[1] || "text";
    const codeText = match[2]
      .replace(/^\n/, "")
      .replace(/\n$/, "");

    const codeBlock = document.createElement("div");
    codeBlock.className = "code-block";

    const header = document.createElement("div");
    header.className = "code-block-header";

    const languageElement = document.createElement("span");
    languageElement.className = "code-language";
    languageElement.textContent = language;

    const copyButton = document.createElement("button");
    copyButton.type = "button";
    copyButton.className = "copy-code-button";
    copyButton.innerHTML = "⧉ <span>Скопировать</span>";

    const pre = document.createElement("pre");
    const code = document.createElement("code");

    // textContent безопасно отображает HTML, JS и CSS как текст
    code.textContent = codeText;

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(codeText);

        copyButton.innerHTML = "✓ <span>Скопировано</span>";

        setTimeout(() => {
          copyButton.innerHTML = "⧉ <span>Скопировать</span>";
        }, 1500);
      } catch (error) {
        console.error("Ошибка копирования:", error);
        copyButton.innerHTML = "⚠ <span>Не удалось скопировать</span>";
      }
    });

    header.appendChild(languageElement);
    header.appendChild(copyButton);

    pre.appendChild(code);
    codeBlock.appendChild(header);
    codeBlock.appendChild(pre);

    fragment.appendChild(codeBlock);

    lastIndex = codeBlockRegex.lastIndex;
  }

  // Обычный текст после последнего блока
  const textAfter = content.slice(lastIndex);

  if (textAfter) {
    const textElement = document.createElement("div");
    textElement.className = "message-content";
    textElement.textContent = textAfter;
    fragment.appendChild(textElement);
  }

  return fragment;
}
    function renderHistory(history) {
      messagesElement.innerHTML = "";

      if (!history || history.length === 0) {
        messagesElement.innerHTML = `
          <div class="empty-state">
            Новый диалог готов.<br>
            Напишите первую задачу или вопрос.
          </div>
        `;

        return;
      }

      history
        .filter((message) =>
          ["user", "assistant"].includes(message.role)
        )
        .forEach(renderMessage);

      scrollToBottom();
    }

function setModel(provider, model) {
      const value = modelKey(provider, model);

      if (models[value]) {
        modelSelect.value = value;
      }

      setStatus(
        modelStatus,
        `Сейчас отвечает: ${getModelLabel(provider, model)}`
      );
    }

function renderConversations(conversations) {
      conversationList.innerHTML = "";

      if (!conversations || conversations.length === 0) {
        conversationList.textContent =
          "Сохранённых диалогов пока нет.";
        return;
      }

      conversations.forEach((conversation) => {
        const row = document.createElement("div");
        row.className = "conversation-row";

        if (conversation.id === conversationId) {
          row.classList.add("active");
        }

        const openButton = document.createElement("button");
        openButton.type = "button";
        openButton.className = "conversation-open";

        const title = document.createElement("span");
        title.className = "conversation-title";
        title.textContent =
          conversation.title || "Новый рабочий диалог";

        const preview = document.createElement("span");
        preview.className = "conversation-preview";
        preview.textContent =
          conversation.last_message_preview ||
          "В этом диалоге пока нет сообщений.";

        const meta = document.createElement("span");
        meta.className = "conversation-meta";
        meta.textContent =
          `${formatDate(conversation.last_message_at)} · ` +
          `${conversation.model || ""}`;

        openButton.append(title, preview, meta);

        openButton.addEventListener("click", async () => {
          if (conversation.id === conversationId) {
            return;
          }

          conversationId = conversation.id;

          localStorage.setItem(
            STORAGE_KEY,
            conversationId
          );

          try {
            await loadHistory();
          } catch (error) {
            setStatus(
              chatStatus,
              `Ошибка открытия диалога: ${error.message}`,
              true
            );
          }
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "conversation-delete";
        deleteButton.textContent = "×";
        deleteButton.title = "Удалить диалог";

        deleteButton.addEventListener("click", async () => {
          const confirmed = confirm(
            `Удалить диалог «${conversation.title}»? ` +
            "Все сообщения и summary этого диалога будут удалены."
          );

          if (!confirmed) {
            return;
          }

          deleteButton.disabled = true;
          deleteButton.textContent = "…";

          try {
            const result = await fetchJson("/api/chat/delete", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                conversation_id: conversation.id
              })
            });

            if (!result.ok) {
              throw new Error(
                result.message || "Не удалось удалить диалог."
              );
            }

            if (conversation.id === conversationId) {
              localStorage.removeItem(STORAGE_KEY);
              conversationId = null;

              await createNewConversation();
            } else {
              await loadConversations();
            }
          } catch (error) {
            setStatus(
              chatStatus,
              `Ошибка удаления: ${error.message}`,
              true
            );

            deleteButton.disabled = false;
            deleteButton.textContent = "×";
          }
        });

        row.append(openButton, deleteButton);
        conversationList.appendChild(row);
      });

    }

    async function loadConversations() {
      try {
        const result = await fetchJson("/api/chat/list");

        renderConversations(result.conversations || []);
      } catch (error) {
        conversationList.textContent =
          `Ошибка загрузки диалогов: ${error.message}`;
      }
    }

    
    async function createNewConversation() {
      setStatus(chatStatus, "Создаём новый диалог...");

      const result = await fetchJson("/api/chat/new", {
        method: "POST"
      });

      conversationId = result.conversation_id;

      localStorage.setItem(
        STORAGE_KEY,
        conversationId
      );

      setModel(result.provider, result.model);
      renderHistory([]);
      
      await loadConversations();

      setStatus(
        chatStatus,
        "Новый диалог готов."
      );
    }

    async function loadHistory() {
      if (!conversationId) {
        await createNewConversation();
        return;
      }

      setStatus(chatStatus, "Загружаем историю диалога...");

      const result = await fetchJson(
        `/api/chat/history?conversation_id=${encodeURIComponent(conversationId)}`
      );

      conversationId = result.conversation_id;

      localStorage.setItem(
        STORAGE_KEY,
        conversationId
      );

      setModel(result.provider, result.model);
      renderHistory(result.messages || []);

      await loadConversations();

      setStatus(chatStatus, "Диалог загружен.");
    }

    async function sendMessage() {
      const message = messageInput.value.trim();

      if (!message) {
        return;
      }

      if (!conversationId) {
        await createNewConversation();
      }

      const userMessage = {
        role: "user",
        content: message,
        created_at: new Date().toISOString()
      };

      if (
        messagesElement.querySelector(".empty-state")
      ) {
        messagesElement.innerHTML = "";
      }

      renderMessage(userMessage);
      scrollToBottom();

      messageInput.value = "";
      messageInput.disabled = true;
      sendButton.disabled = true;

      setStatus(chatStatus, "Агент думает...");

      try {
        const result = await fetchJson("/api/chat/send", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            conversation_id: conversationId,
            message
          })
        });

        renderMessage({
          role: "assistant",
          content: result.answer,
          created_at: new Date().toISOString(),
          metadata: {
            provider: result.provider,
            model: result.model
          }
        });

        setModel(result.provider, result.model);
        setStatus(chatStatus, "Готово.");
        scrollToBottom();

await loadConversations();


        
      } catch (error) {
        setStatus(
          chatStatus,
          `Ошибка ответа: ${error.message}`,
          true
        );
      } finally {
        messageInput.disabled = false;
        sendButton.disabled = false;
        messageInput.focus();
      }
    }

 modelSelect.addEventListener("change", async () => {
      const selectedValue = modelSelect.value;

      const selectedParts = selectedValue.split("|");

      const selectedProvider = selectedParts[0];
      const selectedModel = selectedParts[1];

      if (!selectedProvider || !selectedModel) {
        setStatus(
          modelStatus,
          "Ошибка: не удалось определить выбранную модель.",
          true
        );
        return;
      }

      modelSelect.disabled = true;

      setStatus(
        modelStatus,
        "Переключаем модель..."
      );

      try {
        const response = await fetch("/api/model/select", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            provider: selectedProvider,
            model: selectedModel
          })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(
            result.message || "Не удалось переключить модель."
          );
        }


setModel(result.provider, result.model);

setStatus(
  modelStatus,
  `✅ Следующий ответ: ${
    getModelLabel(
      result.provider,
      result.model
    )
  }`
);


        
      } catch (error) {
        setStatus(
          modelStatus,
          `Ошибка переключения: ${error.message}`,
          true
        );
      } finally {
        modelSelect.disabled = false;
      }
    });


    newChatButton.addEventListener("click", async () => {
      newChatButton.disabled = true;

      try {
        await createNewConversation();
      } catch (error) {
        setStatus(
          chatStatus,
          `Ошибка нового диалога: ${error.message}`,
          true
        );
      } finally {
        newChatButton.disabled = false;
      }
    });

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", (event) => {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        sendMessage();
      }
    });

    async function initializeChat() {
      await loadModels();

      conversationId =
        localStorage.getItem(STORAGE_KEY);

      try {
        if (conversationId) {
          await loadHistory();
        } else {
          await createNewConversation();
        }
      } catch (error) {
        setStatus(
          chatStatus,
          `Ошибка запуска чата: ${error.message}`,
          true
        );
      }
    }
refreshConversationsButton.addEventListener(
      "click",
      loadConversations
    );
scrollUpButton.addEventListener("click", () => {
      messagesElement.scrollBy({
        top: -Math.max(
          400,
          messagesElement.clientHeight * 0.8
        ),
        behavior: "smooth"
      });
    });

    scrollDownButton.addEventListener("click", () => {
      messagesElement.scrollBy({
        top: Math.max(
          400,
          messagesElement.clientHeight * 0.8
        ),
        behavior: "smooth"
      });
    });
function updateSidebarState(isHidden) {
      chatShell.classList.toggle(
        "sidebar-hidden",
        isHidden
      );

      toggleSidebarButton.textContent = isHidden
        ? "☰ Показать диалоги"
        : "☰ Скрыть диалоги";

      localStorage.setItem(
        SIDEBAR_STORAGE_KEY,
        isHidden ? "true" : "false"
      );
    }

    toggleSidebarButton.addEventListener("click", () => {
      const isHidden = chatShell.classList.contains(
        "sidebar-hidden"
      );

      updateSidebarState(!isHidden);
    });

    updateSidebarState(
      localStorage.getItem(SIDEBAR_STORAGE_KEY) === "true"
    );

    initializeChat();
  </script>
</body>
