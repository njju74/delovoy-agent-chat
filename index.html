<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Деловой агент — личный ассистент</title>

  <link
    href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css"
    rel="stylesheet"
  >

  <style>

    .documents-panel {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
    }

    .documents-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .documents-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .documents-head button,
    .document-delete {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 7px 10px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    .document-delete {
      border-color: #8f3f49;
      color: #ff9aa6;
    }

    .documents-status {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .documents-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .document-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .document-title {
      font-weight: 700;
    }

    .document-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    
    :root {
      --bg: #0f1620;
      --card: #172233;
      --text: #edf3f9;
      --muted: #9aabbd;
      --accent: #61d4b3;
      --line: #2d4057;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 24px 14px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .sub {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .upload-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 16px;
    }

    .upload-panel input {
      max-width: 320px;
      color: var(--muted);
    }

    .upload-panel button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--accent);
      color: #0f1620;
      font-weight: 700;
      cursor: pointer;
    }

    .upload-panel button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .upload-status {
      width: 100%;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .upload-status.error {
      color: var(--danger);
    }

    main {
      max-width: 1100px;
      height: calc(100vh - 180px);
      min-height: 520px;
      margin: 0 auto;
      padding: 0 24px 24px;
    }

    #n8n-chat {
      height: 100%;
    }
  </style>
</head>

<body>
  <header>
    <h1>Деловой агент — личный ассистент</h1>

    <p class="sub">
      Рабочий чат с памятью проектов, PostgreSQL и pgvector.
    </p>

    <div class="upload-panel">
      <input
        id="knowledge-file"
        type="file"
        accept=".txt,.md,text/plain,text/markdown"
      >

      <button id="upload-button" type="button">
        📎 Добавить в память
      </button>

      <p id="upload-status" class="upload-status">
        Поддерживаются TXT и Markdown-файлы до 20 МБ.
      </p>
    </div>
    
    <div class="documents-panel">
  <div class="documents-head">
    <h2>Память и документы</h2>

    <button id="refresh-documents" type="button">
      ↻ Обновить
    </button>
  </div>

  <p id="documents-status" class="documents-status">
    Загружаем список документов...
  </p>

  <div id="documents-list" class="documents-list"></div>
</div>

  </header>

  <main>
    <div id="n8n-chat"></div>
  </main>

  <script src="/config.js"></script>

  <script type="module">
    import {
      createChat
    } from "https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js";

    createChat({
      webhookUrl: window.CHAT_CONFIG.webhookUrl,
      mode: "fullscreen",
      target: "#n8n-chat",
      showWelcomeScreen: true,
      initialMessages: [
        "Здравствуйте. Я ваш личный рабочий ассистент Делового агента."
      ],
      i18n: {
        en: {
          title: "Деловой агент",
          subtitle: "Личный рабочий ассистент",
          inputPlaceholder: "Напишите задачу или вопрос...",
          getStarted: "Начать диалог"
        }
      }
    });

    const fileInput = document.getElementById("knowledge-file");
    const uploadButton = document.getElementById("upload-button");
    const uploadStatus = document.getElementById("upload-status");

    uploadButton.addEventListener("click", async () => {
      const file = fileInput.files[0];

      if (!file) {
        uploadStatus.textContent = "Сначала выберите TXT или Markdown-файл.";
        uploadStatus.classList.add("error");
        return;
      }

      const allowedExtensions = [".txt", ".md"];
      const lowerName = file.name.toLowerCase();

      if (!allowedExtensions.some((ext) => lowerName.endsWith(ext))) {
        uploadStatus.textContent = "Пока поддерживаются только файлы TXT и MD.";
        uploadStatus.classList.add("error");
        return;
      }

      if (file.size > 20 * 1024 * 1024) {
        uploadStatus.textContent = "Файл больше 20 МБ. Выберите файл меньшего размера.";
        uploadStatus.classList.add("error");
        return;
      }

      const formData = new FormData();

      formData.append("knowledge_file", file);

      uploadButton.disabled = true;
      uploadStatus.classList.remove("error");
      uploadStatus.textContent = "Файл загружается и ставится в очередь обработки...";

      try {
        const response = await fetch("/api/upload", {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(
            result.message || "Не удалось отправить файл в n8n."
          );
        }

        uploadStatus.textContent =
          "✅ Файл принят. Агент сможет использовать его после обработки.";

        fileInput.value = "";
        setTimeout(loadDocuments, 1500);
      } catch (error) {
        uploadStatus.textContent =
          `❌ Ошибка загрузки: ${error.message}`;
        uploadStatus.classList.add("error");
      } finally {
        uploadButton.disabled = false;
      }
    });

    const refreshDocumentsButton =
      document.getElementById("refresh-documents");

    const documentsStatus =
      document.getElementById("documents-status");

    const documentsList =
      document.getElementById("documents-list");

    function formatDate(value) {
      if (!value) return "—";

      return new Date(value).toLocaleString("ru-RU");
    }

    async function loadDocuments() {
      documentsStatus.classList.remove("error");
      documentsStatus.textContent = "Загружаем список документов...";
      documentsList.innerHTML = "";

      try {
        const response = await fetch("/api/documents");
        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(
            result.message || "Не удалось получить список документов."
          );
        }

        const documents = result.documents || [];

        if (documents.length === 0) {
          documentsStatus.textContent =
            "В память пока не загружено ни одного документа.";
          return;
        }

        documentsStatus.textContent =
          `Документов в памяти: ${documents.length}`;

       documents.forEach((doc) => {
          const row = window.document.createElement("div");
          row.className = "document-row";

          const info = window.document.createElement("div");

          const title = window.document.createElement("div");
          title.className = "document-title";
          title.textContent = doc.title || "Без названия";

          const meta = window.document.createElement("div");
          meta.className = "document-meta";

          meta.textContent =
            `Файл: ${doc.original_filename || "—"} · ` +
            `Статус: ${doc.status} · ` +
            `Фрагментов: ${doc.actual_chunks || doc.total_chunks || 0} · ` +
            `Загружен: ${formatDate(doc.created_at)}`;

          info.append(title, meta);

          const deleteButton = window.document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "document-delete";
          deleteButton.textContent = "Удалить";

          deleteButton.addEventListener("click", async () => {
            const confirmed = confirm(
              `Удалить документ «${doc.title}» и все его фрагменты из памяти?`
            );

            if (!confirmed) return;

            deleteButton.disabled = true;
            deleteButton.textContent = "Удаляем...";

            try {
              const response = await fetch("/api/delete-document", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  document_id: doc.id
                })
              });

              const result = await response.json();

              if (!response.ok || !result.ok) {
                throw new Error(
                  result.message || "Не удалось удалить документ."
                );
              }

              await loadDocuments();
            } catch (error) {
              documentsStatus.textContent =
                `Ошибка удаления: ${error.message}`;

              documentsStatus.classList.add("error");

              deleteButton.disabled = false;
              deleteButton.textContent = "Удалить";
            }
          });

          row.append(info, deleteButton);
          documentsList.appendChild(row);
        });



        
      } catch (error) {
        documentsStatus.textContent =
          `Ошибка загрузки списка: ${error.message}`;

        documentsStatus.classList.add("error");
      }
    }

    refreshDocumentsButton.addEventListener("click", loadDocuments);

    loadDocuments();

  </script>
</body>
</html>
